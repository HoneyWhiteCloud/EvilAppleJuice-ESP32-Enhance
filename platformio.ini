; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = airm2m_core_esp32c3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:airm2m_core_esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
framework = arduino
monitor_speed = 115200

; The defs for an generic ESP32-C3 board off Aliexpress
; For example this one: https://www.aliexpress.com/item/1005005319963906.html
[env:generic_esp32c3]
platform = espressif32
board = esp32-c3-devkitc-02
board_build.flash_mode = dio
framework = arduino
monitor_speed = 115200
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1  

; The defs for an generic ESP32-NodeMCU (ESP32S) board off Aliexpress
[env:generic_nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

[env:m5stickc]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200

; ESP32-C6 DevKitC-1 (8MB flash) - the standard ESP32-C6 reference board
; ESP32-C6 requires arduino-esp32 3.x, which the official espressif32 platform
; does not ship yet. The pioarduino platform bundles arduino-esp32 3.x + ESP-IDF libs.
[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = post:fix_map_path.py

; ESP32-C6 DevKitM-1 (4MB flash) - if you have the smaller module board
[env:esp32-c6-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
extra_scripts = post:fix_map_path.py
